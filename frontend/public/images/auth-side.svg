<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#155dfc"/>
      <stop offset="0.55" stop-color="#4f2bff"/>
      <stop offset="1" stop-color="#00bfb3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0e9ff"/>
      <stop offset="1" stop-color="#c7f3ee"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#f5a300"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0b0c1e" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- nen -->
  <rect width="480" height="640" fill="url(#bg)"/>
  <rect width="480" height="640" fill="url(#glow)"/>

  <!-- vong cung trang tri -->
  <circle cx="420" cy="90" r="150" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="40"/>
  <circle cx="60" cy="600" r="120" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="28"/>
  <circle cx="380" cy="520" r="6" fill="#fff" fill-opacity="0.6"/>
  <circle cx="96" cy="150" r="4" fill="#fff" fill-opacity="0.7"/>
  <circle cx="300" cy="70" r="3" fill="#fff" fill-opacity="0.6"/>

  <!-- the khoa hoc phia sau -->
  <g filter="url(#shadow)" transform="translate(150 150) rotate(8)">
    <rect width="230" height="270" rx="22" fill="#fff" fill-opacity="0.92"/>
    <rect x="16" y="16" width="198" height="110" rx="14" fill="url(#thumb)"/>
    <rect x="16" y="144" width="150" height="14" rx="7" fill="#0b0c1e" fill-opacity="0.75"/>
    <rect x="16" y="168" width="110" height="10" rx="5" fill="#64748b" fill-opacity="0.5"/>
    <rect x="16" y="214" width="70" height="26" rx="8" fill="#e3eeff"/>
  </g>

  <!-- the khoa hoc chinh -->
  <g filter="url(#shadow)" transform="translate(70 200) rotate(-5)">
    <rect width="250" height="300" rx="24" fill="#fff"/>
    <rect x="18" y="18" width="214" height="124" rx="16" fill="url(#thumb)"/>
    <!-- nut phat -->
    <circle cx="125" cy="80" r="26" fill="#155dfc"/>
    <path d="M117 67 L139 80 L117 93 Z" fill="#fff"/>
    <rect x="18" y="160" width="170" height="15" rx="7.5" fill="#0b0c1e" fill-opacity="0.8"/>
    <rect x="18" y="185" width="120" height="11" rx="5.5" fill="#64748b" fill-opacity="0.45"/>
    <!-- thanh tien do -->
    <rect x="18" y="222" width="214" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="18" y="222" width="140" height="10" rx="5" fill="#155dfc"/>
    <rect x="18" y="252" width="84" height="28" rx="9" fill="#e3eeff"/>
    <rect x="30" y="262" width="60" height="8" rx="4" fill="#155dfc" fill-opacity="0.7"/>
  </g>

  <!-- huy hieu chung nhan -->
  <g filter="url(#shadow)" transform="translate(300 400)">
    <circle cx="48" cy="48" r="48" fill="url(#gold)"/>
    <circle cx="48" cy="48" r="36" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="3"/>
    <path d="M30 49 L43 62 L67 36" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- the nho "da hoan thanh" -->
  <g filter="url(#shadow)" transform="translate(250 112)">
    <rect width="150" height="54" rx="16" fill="#fff"/>
    <circle cx="27" cy="27" r="13" fill="#00bfb3"/>
    <path d="M21 27 L26 32 L34 22" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="50" y="18" width="80" height="9" rx="4.5" fill="#0b0c1e" fill-opacity="0.75"/>
    <rect x="50" y="32" width="56" height="7" rx="3.5" fill="#64748b" fill-opacity="0.45"/>
  </g>
</svg>
