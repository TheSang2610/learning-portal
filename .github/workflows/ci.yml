name: CI

on:
  push:
    branches: [main]
  pull_request:

# MOT job duy nhat ke tu khi backend tach ra kho rieng.
#
# Truoc day file nay co hai job song song (frontend / backend) vi ca hai nua
# nam chung mot kho, va "working-directory" tro vao tung thu muc con. Backend
# gio o https://github.com/TheSang2610/learning-portal-backend va mang theo
# workflow cua no, nen o day khong con gi de chay song song nua.
#
# Ma nguon da len GOC kho, nen KHONG con "working-directory" va
# "cache-dependency-path" cung tro thang vao package-lock.json o goc. De lai
# duong dan "frontend/..." cu la CI do ngay o buoc cai, voi loi kieu "khong tim
# thay package-lock.json".
jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 20 het han ho tro tu thang 4/2025. Giu cung so voi Dockerfile
      # de cho nao cung chay tren mot phien ban.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Tach tung buoc de log chi thang vao dung cho vo,
      # thay vi mot buoc "verify" duy nhat khong biet hong o dau.
      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

# KHONG buoc nao can bi mat. Build cua Next o day khong goi API that: moi loi
# goi du lieu deu co gia tri du phong, xem src/services/serverFetch.ts.
