name: CI

on:
  push:
    branches: [main, dev, TheSang]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cung phien ban voi Dockerfile va voi CI cua frontend.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Tach tung buoc de log chi thang vao dung cho vo,
      # thay vi mot buoc gop khong biet hong o dau.

      # Bat loi cu phap o MOI file, ke ca file khong duoc test nao cham toi.
      # Backend chua co linter nen day la luoi an toan re nhat.
      - name: Kiem cu phap
        run: |
          find src index.js -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "Tat ca file .js deu phan tich duoc"

      - name: Test
        run: npm test

# KHONG buoc nao can bi mat: cac test o day deu la ham thuan, khong mo ket noi
# CSDL va khong goi Cloudinary. Muon test cham that vao dich vu ngoai thi phai
# dat secrets trong repo va tach thanh workflow rieng.
